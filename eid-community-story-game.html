    function classifyFirebaseError(err) {
      const code = err?.code || "";
      const msg = err?.message || "";
      if (code.includes("auth/unauthorized-domain")) return "Auth error: unauthorized-domain";
      if (code.includes("permission-denied")) return "Firestore permission denied";
      if (code.includes("unauthenticated") || code.includes("auth/")) return "Signed in required / Auth not ready / Rules blocked";
      if (msg.toLowerCase().includes("unauthorized domain")) return "Auth error: unauthorized-domain";
      return "Connection issue. Check Firebase config/rules.";
    }

    function createFirebaseStore() {
      const app = initializeApp(FIREBASE_CONFIG);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const root = doc(db, "eid10write", "main");

      async function ensureAuthReady() {
        if (state.authReady && state.uid) return;
        throw new Error("AUTH_NOT_READY");
      }

      async function guardWrite(fn) {
        await ensureAuthReady();
        try {
          const result = await fn();
          state.firestoreReady = true;
          if (!state.authError) setConnectionStatus("Firebase connected ✅");
          return result;
        } catch (err) {
          console.error("[Firestore Write Error]", err);
          const label = classifyFirebaseError(err);
          state.authError = label;
          setConnectionStatus(label);
          throw err;
        }
      }

      function buildDerivedState(cache) {
        const headlineVotes = new Map();
        const snippetVotes = new Map();
        for (const v of cache.votes) {
          if (v.itemType === "headline") headlineVotes.set(v.itemId, (headlineVotes.get(v.itemId) || 0) + 1);
          if (v.itemType === "snippet") snippetVotes.set(v.itemId, (snippetVotes.get(v.itemId) || 0) + 1);
        }
        const headlines = cache.headlines.map(h => ({ ...h, votes: headlineVotes.get(h.id) || 0, status: "open" }));
        const snippets = cache.snippets.map(sn => ({ ...sn, votes: snippetVotes.get(sn.id) || 0, status: "open" }));
        const snippetById = new Map(snippets.map(sn => [sn.id, sn]));
        const archivedStoryIds = new Set((cache.archives || []).map(a => a.storyId).filter(Boolean));

        const stories = cache.stories
          .filter(st => !archivedStoryIds.has(st.id))
          .sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0))
          .slice(0, 1)
          .map(st => {
            const wins = cache.wins.filter(w => w.storyId === st.id).sort((a,b)=> (a.round||0)-(b.round||0));
            const pieceWins = wins.filter(w => w.kind !== "conclusion");
            const conclusionWin = wins.find(w => w.kind === "conclusion");
            const pieces = pieceWins.map(w => {
              const sn = snippetById.get(w.snippetId);
              return sn ? { id: sn.id, text: sn.text, name: sn.name, handle: sn.handle, acceptedAt: w.createdAt || now() } : null;
            }).filter(Boolean);
            const conclusionSnippet = conclusionWin ? snippetById.get(conclusionWin.snippetId) : null;
            const conclusion = conclusionSnippet ? { id: conclusionSnippet.id, text: conclusionSnippet.text, name: conclusionSnippet.name, handle: conclusionSnippet.handle, acceptedAt: conclusionWin.createdAt || now() } : null;
            return {
              id: st.id,
              headlineId: st.headlineId,
              headlineText: st.headlineText,
              round: pieceWins.length + 1,
              pieces,
              conclusion,
              createdAt: st.createdAt || now(),
              published: false
            };
          });

        for (const st of stories) {
          const wins = cache.wins.filter(w => w.storyId === st.id);
          const winKey = new Set(wins.map(w => `${w.round}:${w.kind}`));
          for (const sn of snippets) {
            if (sn.storyId !== st.id) continue;
            const matchedWin = wins.find(w => w.snippetId === sn.id);
            if (matchedWin) {
              sn.status = "accepted";
              sn.acceptedAt = matchedWin.createdAt || now();
            } else if (winKey.has(`${sn.round}:${sn.kind || "snippet"}`)) {
              sn.status = "not_selected";
            }
          }
        }

        for (const h of headlines) {
          if (cache.stories.some(st => st.headlineId === h.id)) h.status = "locked";
        }

        return {
          game: { activeStories: stories },
          headlines: headlines.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),
          snippets: snippets.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),
          archives: cache.archives.sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0))
        };
      }

      return {
        async initUser() {
          setConnectionStatus("Connecting…");
          await signInAnonymously(auth);
          await new Promise((resolve, reject) => {
            const unsub = onAuthStateChanged(auth, (user) => {
              if (user?.uid) {
                state.uid = user.uid;
                state.authReady = true;
                state.authError = "";
                setConnectionStatus("Firebase connected ✅");
                unsub();
                resolve();
              }
            }, (err) => {
              console.error("[Auth Error]", err);
              const label = classifyFirebaseError(err);
              state.authError = label;
              setConnectionStatus(label);
              unsub();
              reject(err);

          });
          await guardWrite(() => setDoc(doc(collection(root, "users"), state.uid), { updatedAt: serverTimestamp() }, { merge: true }));

        subscribeAll(onData) {
          const unsubs = [];
          const cache = { headlines:[], snippets:[], votes:[], stories:[], wins:[], archives:[] };
          const emit = ()=> onData(buildDerivedState(cache));
          unsubs.push(onSnapshot(query(collection(root, "headlines"), orderBy("createdAt","desc")), s => {
            cache.headlines = s.docs.map(d=>({id:d.id, ...d.data(), createdAt:d.data().createdAt?.toMillis?.() || now()})); emit();
          }, err => { console.error("[Headlines Snapshot Error]", err); setConnectionStatus(classifyFirebaseError(err)); }));
          unsubs.push(onSnapshot(query(collection(root, "snippets"), orderBy("createdAt","desc")), s => {
            cache.snippets = s.docs.map(d=>({id:d.id, ...d.data(), createdAt:d.data().createdAt?.toMillis?.() || now(), acceptedAt:d.data().acceptedAt?.toMillis?.() })); emit();
          }, err => { console.error("[Snippets Snapshot Error]", err); setConnectionStatus(classifyFirebaseError(err)); }));
          unsubs.push(onSnapshot(query(collection(root, "votes"), orderBy("at","desc")), s => {
            cache.votes = s.docs.map(d=>({id:d.id, ...d.data(), at:d.data().at?.toMillis?.() || now()})); emit();
          }, err => { console.error("[Votes Snapshot Error]", err); setConnectionStatus(classifyFirebaseError(err)); }));
          unsubs.push(onSnapshot(query(collection(root, "stories"), orderBy("createdAt","desc")), s => {
            cache.stories = s.docs.map(d=>({id:d.id, ...d.data(), createdAt:d.data().createdAt?.toMillis?.() || now()})); emit();
          }, err => { console.error("[Stories Snapshot Error]", err); setConnectionStatus(classifyFirebaseError(err)); }));
          unsubs.push(onSnapshot(query(collection(root, "story_wins"), orderBy("createdAt","desc")), s => {
            cache.wins = s.docs.map(d=>({id:d.id, ...d.data(), createdAt:d.data().createdAt?.toMillis?.() || now()})); emit();
          }, err => { console.error("[Wins Snapshot Error]", err); setConnectionStatus(classifyFirebaseError(err)); }));
          unsubs.push(onSnapshot(query(collection(root, "archives"), orderBy("publishedAt","desc")), s => {
            cache.archives = s.docs.map(d=>({id:d.id, ...d.data(), publishedAt:d.data().publishedAt?.toMillis?.() || now()})); emit();
          }, err => { console.error("[Archives Snapshot Error]", err); setConnectionStatus(classifyFirebaseError(err)); }));
          return () => unsubs.forEach(u=>u());
        },
        async canSubmit(uid) {
          await ensureAuthReady();
          const cutoff = now() - RATE_LIMIT_WINDOW_MS;
          const q = query(collection(root, "submissions"), where("uid", "==", uid), where("at", ">=", cutoff));
          const snap = await getDocs(q);
          return snap.size < RATE_LIMIT_COUNT;
        },
        async markSubmission(uid) {
          await guardWrite(async () => {
            await addDoc(collection(root, "submissions"), { uid, at: now() });
          });
        },
        async addHeadline(data) {
          return guardWrite(async () => {
            const ref = await addDoc(collection(root, "headlines"), { ...data, createdAt: serverTimestamp() });
            return ref.id;
          });
        },
        async addSnippet(data) {
          return guardWrite(async () => {
            const ref = await addDoc(collection(root, "snippets"), { ...data, createdAt: serverTimestamp() });
            return ref.id;
          });
        },
        async vote(itemType, itemId, uid) {
          return guardWrite(async () => {
            const voteRef = doc(collection(root, "votes"), `${itemType}_${itemId}_${uid}`);
            try {
              await setDoc(voteRef, { uid, itemType, itemId, at: serverTimestamp() });
            } catch (err) {
              if ((err?.code || "").includes("permission-denied")) return { ok:false, message:"You already voted on this or rules blocked this vote." };
              throw err;
            }

            const voteSnap = await getDocs(query(collection(root, "votes"), where("itemType", "==", itemType), where("itemId", "==", itemId)));
            const totalVotes = voteSnap.size;

            if (itemType === "headline" && totalVotes >= VOTE_TARGET) {
              const itemSnap = await getDoc(doc(collection(root, "headlines"), itemId));
              if (itemSnap.exists()) {
                const item = itemSnap.data();
                const storyRef = doc(collection(root, "stories"), `story_${itemId}`);
                try {
                  await setDoc(storyRef, {
                    headlineId: itemId,
                    headlineText: item.text,
                    createdBy: uid,
                    createdAt: serverTimestamp()
                  });
                } catch (err) {
                  console.warn("[Story create skipped]", err);
                }
              }
            }

            if (itemType === "snippet" && totalVotes >= VOTE_TARGET) {
              const itemSnap = await getDoc(doc(collection(root, "snippets"), itemId));
              if (itemSnap.exists()) {
                const item = itemSnap.data();
                const kind = item.kind || "snippet";
                const winRef = doc(collection(root, "story_wins"), `${item.storyId}_${item.round}_${kind}`);
                try {
                  await setDoc(winRef, {
                    storyId: item.storyId,
                    round: item.round,
                    kind,
                    snippetId: itemId,
                    createdBy: uid,
                    createdAt: serverTimestamp()
                  });
                } catch (err) {
                  console.warn("[Story win create skipped]", err);
                }
              }
            }
            return { ok:true };
          });
        },
        async publishStory(storyObj, storyId) {
          await guardWrite(async () => {
            await addDoc(collection(root, "archives"), { ...storyObj, storyId, publishedAt: serverTimestamp() });
          });
          return true;
        }
      }
    }


    function getActiveStories() {
      if (Array.isArray(state.game?.activeStories)) return state.game.activeStories;
      if (state.game?.activeStory) return [state.game.activeStory];
      return [];
    }

    function findStoryById(storyId) {
      return getActiveStories().find(s => s.id === storyId) || null;
    }

    function selectedStory() {
      const stories = getActiveStories();
      if (!stories.length) return null;
      return stories[0];
    }

    let store;
    async function init() {
      const hasFirebase = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.authDomain;
      if (hasFirebase) {
        try {
          store = createFirebaseStore();
          await store.initUser();
          state.mode = "realtime";
        } catch (e) {
          console.error("[Firebase Init/Auth Failed]", e);
          state.mode = "realtime";
          if (!state.authError) setConnectionStatus(classifyFirebaseError(e));
          toast("Firebase auth/connect failed. Check connection status.");
        }
      } else {
        state.mode = "demo";
        setConnectionStatus("Demo Mode (Local Only): Firebase config missing.");
        store = createDemoStore();
        state.uid = localStorage.getItem("eid_demo_uid") || ("demo_" + Math.random().toString(36).slice(2,10));
        localStorage.setItem("eid_demo_uid", state.uid);
        await store.initUser(state.uid);
      }
      el.userIdLabel.textContent = uidShort(state.uid);
      store.subscribeAll(data => {
        state.game = data.game || { activeStories: [] };
        state.headlines = data.headlines || [];
        state.snippets = data.snippets || [];
        state.archives = data.archives || [];
        render();
        maybeJumpToSharedTarget();
        autoPublishIfConclusionWon();
      });
    }


    let publishingNow = false;
    async function autoPublishIfConclusionWon() {
      if (publishingNow) return;
      const story = selectedStory();
      if (!story || !story.conclusion || story.published) return;
      publishingNow = true;
      try {
        const storyObj = {
          headlineText: story.headlineText,
          pieces: (story.pieces || []).concat([story.conclusion]),
          wordCount: wordCount([story.headlineText].concat((story.pieces || []).map(p => p.text), story.conclusion.text).join(" ")),
          publishDate: fmtDate(now())
        };
        await generatePdf(storyObj);
        await store.publishStory(storyObj, story.id);
        toast("Conclusion locked! Story exported to PDF and archived.");
      } finally {
        publishingNow = false;
      }
    }

    function enforceKindness(...parts) {
      const combined = parts.map(safeText).join(" ");
      return !hasBlockedWord(combined);
    }

    function ensureWriteAllowed() {
      if (state.mode === "demo") return true;
      if (!state.authReady || !state.uid) {
        toast("Signed in required / Auth not ready / Rules blocked");

        return false;
      }
      return true;
    }

    async function checkRateLimit() {
      if (!ensureWriteAllowed()) return false;
      const allowed = await store.canSubmit(state.uid);
      if (!allowed) {
        toast("Rate limit reached: max 3 submissions per 10 minutes.");
      }
      return allowed;
    }

    function makeButton(text, className, onClick, label) {
      const b = document.createElement("button");
      b.className = `btn ${className}`;
      b.type = "button";
      b.textContent = text;
      if (label) b.setAttribute("aria-label", label);
      b.addEventListener("click", onClick);
      return b;
    }

    function buildShareUrl(mode, id) {
      const u = new URL(GAME_LINK);
      u.searchParams.set("mode", mode);
      u.searchParams.set("id", id);
      return u.toString();
    }

    async function shareItem(mode, id, title) {
      const url = buildShareUrl(mode, id);
      const text = `Vote for my contribution in 10-to-Write! ${title}`;
      if (navigator.share) {
        try { await navigator.share({ title: "10-to-Write", text, url }); return; }
        catch {}
      }
      const msg = encodeURIComponent(`${text} ${url}`);
      const holder = document.createElement("div");
      holder.className = "item";
      const p = document.createElement("p"); p.textContent = "Share to get votes:"; holder.appendChild(p);
      const links = [
        ["WhatsApp",`https://wa.me/?text=${msg}`],
        ["Facebook",`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`],
        ["X",`https://twitter.com/intent/tweet?text=${msg}`]
      ];
      links.forEach(([n,l])=>{ const a=document.createElement("a");a.href=l;a.target="_blank";a.rel="noopener";a.textContent=n; a.style.marginRight="10px"; holder.appendChild(a); });
      const cpy = makeButton("Copy link", "btn-share", async()=>{ await navigator.clipboard.writeText(url); toast("Link copied!"); holder.remove();});
      holder.appendChild(document.createElement("br")); holder.appendChild(cpy);
      document.body.appendChild(holder);
      holder.style.position = "fixed"; holder.style.bottom = "180px"; holder.style.left = "50%"; holder.style.transform = "translateX(-50%)"; holder.style.zIndex = "99";
      setTimeout(()=>holder.remove(), 9000);
    }

    function voteStatusText(votes) {
      const cast = votes || 0;
      const short = Math.max(0, VOTE_TARGET - cast);
      return { cast, short };
    }

    function showSubmissionShare(container, personName, mode, id, pieceTitle) {
      const url = buildShareUrl(mode, id);
      const message = `Support ${personName}'s contribution in 10-to-Write and vote now: ${pieceTitle}`;
      container.textContent = "";
      container.classList.remove("hidden");
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = message;
      container.appendChild(m);
      const row = document.createElement("div");
      row.style.display = "flex";
      row.style.flexWrap = "wrap";
      row.style.gap = "8px";
      row.style.marginTop = "8px";
      const msg = encodeURIComponent(`${message} ${url}`);
      const links = [
        ["X", `https://twitter.com/intent/tweet?text=${msg}`],
        ["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(message)}`],
        ["WhatsApp", `https://wa.me/?text=${msg}`]
      ];
      links.forEach(([label, href]) => {
        const a = document.createElement("a");
        a.className = "btn btn-share";
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = label;
        row.appendChild(a);
      });
      container.appendChild(row);
    }

    function maybeJumpToSharedTarget() {
      const mode = state.urlTarget.get("mode");
      const id = state.urlTarget.get("id");
      if (!mode || !id) return;
      const target = document.querySelector(`[data-share-id='${mode}_${id}']`);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.add("highlight");
        setTimeout(() => target.classList.remove("highlight"), 3600);
      }
    }

    function render() {
      renderHeadlines();
      renderPreview();
      renderStory();
      renderArchives();
    }


    function renderPreview() {
      el.previewList.textContent = "";
      const st = selectedStory();
      if (!st) {
        const p = document.createElement("p"); p.className = "sub"; p.textContent = "No active community message yet. Vote a headline in Section A.";
        el.previewList.appendChild(p);
        return;
      }
      const card = document.createElement("div"); card.className = "item";
      const t = document.createElement("div"); t.style.fontWeight = "900"; t.textContent = st.headlineText;
      const words = wordCount([st.headlineText].concat((st.pieces||[]).map(p=>p.text), st.conclusion?.text||"").join(" "));
      const m = document.createElement("div"); m.className = "meta"; m.textContent = `Round ${st.round} • ${words}/${WORD_TARGET} words • ${(st.pieces||[]).length} accepted pieces`;
      card.append(t,m);
      const full = [st.headlineText].concat((st.pieces||[]).map(p=>p.text), st.conclusion?.text ? [st.conclusion.text] : []).join(" ");
      const flow = document.createElement("div"); flow.style.marginTop = "8px"; flow.textContent = full || "Message text will appear here as community lines are accepted.";
      card.appendChild(flow);
      el.previewList.appendChild(card);
    }

    function renderHeadlines() {
      el.headlineList.textContent = "";
      if (!state.headlines.length) {
        const p = document.createElement("p"); p.className = "sub"; p.textContent = "No headlines yet. Be the first!";
        el.headlineList.appendChild(p);
        return;
      }
      state.headlines.forEach((h, idx) => {
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.shareId = `headline_${h.id}`;

        const t = document.createElement("div"); t.textContent = `${idx + 1}. ${h.text}`; t.style.fontWeight = "800";
        div.appendChild(t);

        const m = document.createElement("div");
        m.className = "meta";
        const vs = voteStatusText(h.votes || 0);
        m.textContent = `By ${h.name} (${h.handle})`;
        div.appendChild(m);
        const vb = document.createElement("div");
        vb.className = "vote-box";
        const vm = document.createElement("div"); vm.className = "vote-main"; vm.textContent = `Votes: ${vs.cast} / ${VOTE_TARGET}`;
        const vsb = document.createElement("div"); vsb.className = "vote-sub"; vsb.textContent = `${vs.short} more needed to win this round`;
        vb.append(vm, vsb);
        div.appendChild(vb);

        const badge = document.createElement("span");
        badge.className = "pill " + (h.status === "locked" ? "p-win" : "p-open");
        badge.textContent = h.status === "locked" ? "Locked In" : "Round Open";
        div.appendChild(badge);

        const actions = document.createElement("div"); actions.style.marginTop = "8px";
        const voteBtn = makeButton("Vote", "btn-vote", async()=>{
          const res = await store.vote("headline", h.id, state.uid);
          toast(res?.message || "Vote added!");
          if (res?.ok && (h.votes + 1) >= VOTE_TARGET) toast("Headline chosen! Story building is now open.");
        }, "Vote headline");
        if (h.status !== "open" || getActiveStories().length >= 1) voteBtn.disabled = true;
        const shareBtn = makeButton("Share to get votes", "btn-share", ()=>shareItem("headline", h.id, h.text), "Share headline");
        actions.append(voteBtn, document.createTextNode(" "), shareBtn);
        div.appendChild(actions);

        el.headlineList.appendChild(div);
      });
    }

    function getCurrentRoundSnippets(story) {
      if (!story) return [];
      return state.snippets.filter(s => s.storyId === story.id && s.kind !== "conclusion" && (s.round === story.round || s.round === story.round - 1));
    }

    function renderStory() {
      const story = selectedStory();
      el.storyPieces.textContent = "";
      el.snippetList.textContent = "";
      el.nextRoundMsg.classList.add("hidden");
      el.conclusionList.textContent = "";
      el.conclusionWrap.classList.add("hidden");

      if (!story) {
        el.storyBadge.className = "pill p-lock";
        el.storyBadge.textContent = "Waiting for headline";
        el.activeStoryInfo.textContent = "No active message yet. Vote a headline in Section A to begin.";
        el.snippetComposer.classList.add("hidden");
        el.storyProgressWrap.classList.add("hidden");
        return;
      }

      el.storyBadge.className = "pill p-open";
      el.storyBadge.textContent = "Round Open";
      el.activeStoryInfo.textContent = `Chosen Headline: ${story.headlineText}`;
      el.snippetComposer.classList.remove("hidden");
      el.storyProgressWrap.classList.remove("hidden");

      const headlineCard = document.createElement("div");
      headlineCard.className = "item";
      const ht = document.createElement("div"); ht.style.fontWeight = "900"; ht.textContent = story.headlineText;
      const hb = document.createElement("span"); hb.className = "pill p-win"; hb.textContent = "Chosen Headline";
      headlineCard.append(ht, hb);
      el.storyPieces.appendChild(headlineCard);

      (story.pieces || []).forEach(p => {
        const c = document.createElement("div"); c.className = "item";
        const tx = document.createElement("div"); tx.textContent = p.text;
        const mt = document.createElement("div"); mt.className = "meta";
        mt.textContent = `By ${p.name} (${p.handle}) • Accepted ${fmtDate(p.acceptedAt)}`;
        c.append(tx, mt);
        el.storyPieces.appendChild(c);
      });

      const totalText = [story.headlineText].concat((story.pieces || []).map(p => p.text)).join(" ");
      const wc = wordCount(totalText);
      el.wordCountLabel.textContent = `${wc} / ${WORD_TARGET} words`;
      el.wordBar.style.width = `${Math.min(100, Math.round((wc / WORD_TARGET) * 100))}%`;

      const goalReached = wc >= WORD_TARGET;
      el.publishBtn.disabled = true;
      el.publishBtn.classList.remove("celebrate");
      if (goalReached) {
        el.conclusionWrap.classList.remove("hidden");
      }

      const roundSnips = getCurrentRoundSnippets(story);
      const currentRoundOpen = roundSnips.filter(s => s.round === story.round && s.status === "open");
      if (!currentRoundOpen.length) {
        const p = document.createElement("p"); p.className = "sub"; p.textContent = `Round ${story.round} is open. Add a candidate snippet.`;
        el.snippetList.appendChild(p);
      }

      roundSnips
        .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
        .forEach(s => {
          const d = document.createElement("div"); d.className = "item"; d.dataset.shareId = `snippet_${s.id}`;
          const tx = document.createElement("div"); tx.textContent = s.text;
          const mt = document.createElement("div"); mt.className = "meta";
          const vs = voteStatusText(s.votes || 0);
          mt.textContent = `By ${s.name} (${s.handle}) • Round ${s.round}`;
          d.append(tx, mt);
          const vb = document.createElement("div");
          vb.className = "vote-box";
          const vm = document.createElement("div"); vm.className = "vote-main"; vm.textContent = `Votes: ${vs.cast} / ${VOTE_TARGET}`;
          const vsb = document.createElement("div"); vsb.className = "vote-sub"; vsb.textContent = `${vs.short} more needed to win this round`;
          vb.append(vm, vsb);
          d.appendChild(vb);
          const badge = document.createElement("span");
          if (s.status === "accepted") { badge.className = "pill p-win"; badge.textContent = "Winner"; }
          else if (s.status === "not_selected") { badge.className = "pill p-lock"; badge.textContent = "Not selected this round"; }
          else { badge.className = "pill p-open"; badge.textContent = "Round Open"; }
          d.appendChild(badge);

          const actions = document.createElement("div"); actions.style.marginTop = "8px";
          const voteBtn = makeButton("Vote", "btn-vote", async()=>{
            const res = await store.vote("snippet", s.id, state.uid);
            toast(res?.message || "Vote added!");
            if (res?.ok && (s.votes + 1) >= VOTE_TARGET) {
              el.nextRoundMsg.classList.remove("hidden");
            }
          }, "Vote snippet");
          if (s.status !== "open" || s.round !== story.round) voteBtn.disabled = true;
          const shareBtn = makeButton("Share to get votes", "btn-share", ()=>shareItem("snippet", s.id, s.text), "Share snippet");
          actions.append(voteBtn, document.createTextNode(" "), shareBtn);
          d.appendChild(actions);
          el.snippetList.appendChild(d);
        });

      if (goalReached) {
        const conclusionCandidates = state.snippets
          .filter(c => c.storyId === story.id && c.kind === "conclusion")
          .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
        if (!conclusionCandidates.length) {
          const p = document.createElement("p"); p.className = "sub"; p.textContent = "No conclusion candidates yet. Submit one above.";
          el.conclusionList.appendChild(p);
        }
        conclusionCandidates.forEach(c => {
          const d = document.createElement("div"); d.className = "item"; d.dataset.shareId = `snippet_${c.id}`;
          const tx = document.createElement("div"); tx.textContent = c.text;
          const mt = document.createElement("div"); mt.className = "meta";
          const vs = voteStatusText(c.votes || 0);
          mt.textContent = `By ${c.name} (${c.handle}) • Conclusion Candidate`;
          d.append(tx, mt);
          const vb = document.createElement("div"); vb.className = "vote-box";
          const vm = document.createElement("div"); vm.className = "vote-main"; vm.textContent = `Votes: ${vs.cast} / ${VOTE_TARGET}`;
          const vsb = document.createElement("div"); vsb.className = "vote-sub"; vsb.textContent = `${vs.short} more needed to lock conclusion`;
          vb.append(vm, vsb);
          d.appendChild(vb);
          const badge = document.createElement("span");
          if (c.status === "accepted") { badge.className = "pill p-win"; badge.textContent = "Winner"; }
          else if (c.status === "not_selected") { badge.className = "pill p-lock"; badge.textContent = "Not selected"; }
          else { badge.className = "pill p-open"; badge.textContent = "Round Open"; }
          d.appendChild(badge);
          const actions = document.createElement("div"); actions.style.marginTop = "8px";
          const voteBtn = makeButton("Vote", "btn-vote", async()=>{
            const res = await store.vote("snippet", c.id, state.uid);
            toast(res?.message || "Vote added!");
          }, "Vote conclusion");
          if (c.status !== "open") voteBtn.disabled = true;
          const shareBtn = makeButton("Share to get votes", "btn-share", ()=>shareItem("snippet", c.id, c.text), "Share conclusion");
          actions.append(voteBtn, document.createTextNode(" "), shareBtn);
          d.appendChild(actions);
          el.conclusionList.appendChild(d);
        });
      }
    }

    function renderArchives() {
      el.archiveList.textContent = "";
      if (!state.archives.length) {
        el.archiveList.textContent = "No published stories yet.";
        return;
      }
      state.archives.forEach(a => {
        const c = document.createElement("div"); c.className = "item";
        const t = document.createElement("div"); t.style.fontWeight = "900"; t.textContent = a.headlineText;
        c.appendChild(t);
        const wc = document.createElement("div"); wc.className = "meta"; wc.textContent = `Word count: ${a.wordCount} • Published: ${fmtDate(a.publishedAt)}`;
        c.appendChild(wc);
        (a.pieces || []).forEach(p=>{
          const line=document.createElement("div"); line.className="meta"; line.textContent=`• ${p.text} — ${p.name} (${p.handle})`; c.appendChild(line);
        });
        const shareBtn = makeButton("Share Archive Entry", "btn-share", ()=>shareItem("archive", a.id, a.headlineText), "Share archive");
        c.appendChild(shareBtn);
        el.archiveList.appendChild(c);
      });
    }

    async function loadImageDataUrl(url) {
      try {
        const res = await fetch(url, { mode: "cors" });
        const blob = await res.blob();
        return await new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onload = () => resolve(fr.result);
          fr.onerror = reject;
          fr.readAsDataURL(blob);
        });
      } catch {
        return null;
      }
    }

    async function generatePdf(storyObj) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "a4" });
      const margin = 40;
      const w = doc.internal.pageSize.getWidth();
      const h = doc.internal.pageSize.getHeight();

      const footer = () => {
        doc.setFontSize(10);
        doc.text("https://emotionalintelligencedeveloper.com/", margin, h - 22);
        doc.text("Game: " + GAME_LINK, margin, h - 10);
      };

      let y = 58;
      const logoData = await loadImageDataUrl(BRAND_LOGO_URL);
      if (logoData) {
        doc.addImage(logoData, "JPEG", margin, 34, 44, 44);
      }
      doc.setFontSize(18);
      doc.text("10-to-Write: The Community Story Game", margin + 52, y);
      y += 26;
      doc.setFontSize(14);
      doc.text(storyObj.headlineText, margin, y);
      y += 20;
      doc.setFontSize(11);

      const lines = [];
      (storyObj.pieces || []).forEach((p, i) => {
        lines.push(`${i + 1}. ${p.text}`);
        lines.push(`   — ${p.name} (${p.handle}), accepted ${fmtDate(p.acceptedAt)}`);
      });

      lines.forEach(line => {
        const wrapped = doc.splitTextToSize(line, w - margin*2);
        wrapped.forEach(l => {
          if (y > h - 70) { footer(); doc.addPage(); y = 58; }
          doc.text(l, margin, y); y += 16;
        });
      });

      if (y > h - 120) { footer(); doc.addPage(); y = 58; }
      y += 10;
      doc.setFontSize(12);
      doc.text("Helpful links:", margin, y); y += 18;
      doc.textWithLink("Recommended Audio Books", margin, y, { url: RECOMMENDED_AUDIO_BOOKS_LINK }); y += 18;
      doc.textWithLink("Self Help Tools", margin, y, { url: "https://emotionalintelligencedeveloper.com/wellbeing-and-self-help-tools/" }); y += 18;
      doc.textWithLink("Game Link", margin, y, { url: GAME_LINK }); y += 18;
      doc.text("Building emotional intelligence is the goal. Have your say and build messages as a community.", margin, y);

      const total = doc.getNumberOfPages();
      for (let p = 1; p <= total; p++) {
        doc.setPage(p);
        footer();
      }
      doc.save(`${storyObj.headlineText.slice(0,40).replace(/[^a-z0-9]+/gi,"_") || "community_story"}.pdf`);
    }

    el.headlineForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = safeText(el.headlineText.value).slice(0,90);
      const name = safeText(el.headlineName.value).slice(0,24);
      const handle = safeText(el.headlineHandle.value);
      if (!text || !name || !handle) return toast("Please fill all headline fields.");
      if (!enforceKindness(text, name, handle)) return toast("Please rewrite kindly.");
      if (getActiveStories().length >= 1) return toast("A live message is already running. Finish it before adding a new headline.");
      const openHeadlineCount = state.headlines.filter(h => h.status === "open").length;
      if (openHeadlineCount >= 10) return toast("Headline board is full (10 max). Vote existing headlines to continue.");
      if (!(await checkRateLimit())) return;
      const newId = await store.addHeadline({ text, name, handle, createdBy: state.uid });
      await store.markSubmission(state.uid);
      el.headlineForm.reset();
      showSubmissionShare(el.headlineSubmitShare, name, "headline", newId, text);
      toast("Headline added! Share this piece to get votes.");
    });

    el.snippetText.addEventListener("input", () => {
      el.snippetCount.textContent = String(el.snippetText.value.length);
    });

    el.snippetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const story = selectedStory();
      if (!story) return toast("No active story right now.");
      const existingWordCount = wordCount([story.headlineText].concat((story.pieces || []).map(p => p.text)).join(" "));
      if (existingWordCount >= WORD_TARGET) return toast("Story body is complete. Submit a conclusion instead.");
      const text = safeText(el.snippetText.value).slice(0,210);
      const name = safeText(el.snippetName.value).slice(0,24);
      const handle = safeText(el.snippetHandle.value);
      if (!text || !name || !handle) return toast("Please fill all snippet fields.");
      if (wordCount(text) < 2) return toast("Please add a meaningful continuation.");
      if (!enforceKindness(text, name, handle)) return toast("Please rewrite kindly.");
      if (!(await checkRateLimit())) return;
      const newId = await store.addSnippet({ storyId: story.id, round: story.round, text, name, handle, kind: "snippet", createdBy: state.uid });
      await store.markSubmission(state.uid);
      el.snippetForm.reset();
      el.snippetCount.textContent = "0";
      showSubmissionShare(el.snippetSubmitShare, name, "snippet", newId, text);
      toast("Candidate addition submitted! Share this piece to get votes.");
    });


    el.conclusionText.addEventListener("input", () => {
      el.conclusionCount.textContent = String(el.conclusionText.value.length);
    });

    el.conclusionForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const story = selectedStory();
      if (!story) return toast("No active story right now.");
      const currentWords = wordCount([story.headlineText].concat((story.pieces || []).map(p => p.text)).join(" "));
      if (currentWords < WORD_TARGET) return toast("Conclusion round unlocks at 396 words.");
      const text = safeText(el.conclusionText.value).slice(0,210);
      const name = safeText(el.conclusionName.value).slice(0,24);
      const handle = safeText(el.conclusionHandle.value);
      if (!text || !name || !handle) return toast("Please fill all conclusion fields.");
      if (!enforceKindness(text, name, handle)) return toast("Please rewrite kindly.");
      if (!(await checkRateLimit())) return;
      const newId = await store.addSnippet({ storyId: story.id, round: story.round, text, name, handle, kind: "conclusion", createdBy: state.uid });
      await store.markSubmission(state.uid);
      el.conclusionForm.reset();
      el.conclusionCount.textContent = "0";
      showSubmissionShare(el.conclusionSubmitShare, name, "snippet", newId, text);
      toast("Conclusion candidate submitted! Share this piece to get votes.");
    });

    // Publish is intentionally locked: PDF export only happens automatically after the winning conclusion is voted in.

    el.howBtn.addEventListener("click", ()=>{
      el.howModalBg.style.display = "flex";
      el.howModalBg.setAttribute("aria-hidden", "false");
    });
    el.closeHow.addEventListener("click", ()=>{
      el.howModalBg.style.display = "none";
      el.howModalBg.setAttribute("aria-hidden", "true");
    });
    el.howModalBg.addEventListener("click", (e)=>{
      if (e.target === el.howModalBg) {
        el.howModalBg.style.display = "none";
        el.howModalBg.setAttribute("aria-hidden", "true");
      }
    });

    el.previewBtn.addEventListener("click", () => { document.getElementById("previewSection").scrollIntoView({behavior:"smooth", block:"start"}); });

    el.backToTop.addEventListener("click", ()=> window.scrollTo({ top:0, behavior:"smooth" }));

    init();
  </script>
</body>
</html>
