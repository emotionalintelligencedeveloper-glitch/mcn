<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Positive Strengths Map — Emotional Intelligence Developer</title>

<style>
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --accent:#2563eb;
  --soft:#eff6ff;
  --muted:#6b7280;
  --safe:#10b981;
  --cta:#f59e0b;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:#111;
}
.wrap{max-width:900px;margin:28px auto;padding:20px}
.card{
  background:var(--card);
  border-radius:14px;
  padding:26px;
  box-shadow:0 10px 28px rgba(16,24,40,0.08);
}
h1,h2,h3{margin-top:0}
.lead{color:var(--muted);line-height:1.6;margin-bottom:16px}

.example-wrap{
  display:flex;
  gap:24px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:28px;
}
.example{max-width:260px;text-align:center}
.example small{color:var(--muted)}

.input{margin:18px 0}
.input input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
}

.q{
  margin:18px 0;
  padding:14px;
  border-radius:12px;
  border:1px solid #e5e7eb;
}
label{display:block;margin:6px 0;cursor:pointer}

.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:10px;
}
.btn{
  padding:10px 16px;
  border-radius:10px;
  border:0;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.btn.secondary{
  background:#e5e7eb;
  color:#111;
}

.result{
  display:none;
  margin-top:28px;
  padding:18px;
  border-radius:14px;
  background:var(--soft);
  border:1px solid #bfdbfe;
}

canvas{max-width:100%;margin:16px auto}

.insights{margin-top:20px}
.insight{
  margin-bottom:14px;
  padding-left:12px;
  border-left:4px solid var(--accent);
}

.download{
  margin-top:22px;
  display:inline-block;
  padding:14px 20px;
  border-radius:12px;
  background:var(--safe);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.cta-section{
  margin-top:28px;
  display:grid;
  gap:18px;
}

.cta-box{
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-radius:14px;
  padding:18px;
}
.cta-box p{color:var(--muted)}

footer{
  margin-top:24px;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<h1>Your Positive Strengths Map</h1>

<p class="lead">
Answer 9 positive questions to discover how your strengths naturally show up.
There are no right or wrong answers — only insight.
</p>

<div class="example-wrap">
  <div class="example"><canvas id="examplePie"></canvas></div>
  <div class="example"><canvas id="exampleRadar"></canvas></div>
</div>

<div class="input">
  <label><strong>Your name (optional)</strong></label>
  <input id="userName">
</div>

<form id="quiz"></form>

<div class="controls">
  <button class="btn" onclick="showResults()">See My Strengths Map</button>
  <button class="btn secondary" onclick="resetTool()">Reset</button>
</div>

<div id="result" class="result">
  <canvas id="pieChart"></canvas>
  <canvas id="radarChart"></canvas>
  <div id="insights"></div>
</div>

<div class="download" onclick="downloadPDF()">Download & Share My Strengths (PDF)</div>

<footer>
Created by Emotional Intelligence Developer — https://emotionalintelligencedeveloper.com/
</footer>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const strengths=["Focus","Self-Trust","Motivation","Calm Presence","Resilience","Growth","Authenticity","Connection","Awareness"];

const strengthInsights={
  "Focus":"This reflects your ability to direct attention and stay engaged.",
  "Self-Trust":"This reflects confidence in your inner judgement.",
  "Motivation":"This reflects purpose-driven energy.",
  "Calm Presence":"This reflects steadiness under pressure.",
  "Resilience":"This reflects adaptability and recovery.",
  "Growth":"This reflects a desire to learn and improve.",
  "Authenticity":"This reflects being genuine.",
  "Connection":"This reflects valuing relationships.",
  "Awareness":"This reflects noticing internal and external cues."
};

const questions=[
  "When starting something important, you usually…",
  "When challenges appear, you tend to…",
  "Your energy feels strongest when…",
  "In conversations, people notice that you…",
  "When plans change, you usually…",
  "You feel confident when you…",
  "Your motivation comes mainly from…",
  "You feel connected when you…",
  "Personal growth for you looks like…"
];

const options=[
  ["Focus","Motivation","Growth","Awareness"],
  ["Resilience","Calm Presence","Growth","Self-Trust"],
  ["Authenticity","Motivation","Connection","Focus"],
  ["Connection","Awareness","Calm Presence","Authenticity"],
  ["Resilience","Self-Trust","Calm Presence","Growth"],
  ["Self-Trust","Authenticity","Focus","Motivation"],
  ["Motivation","Growth","Connection","Focus"],
  ["Connection","Authenticity","Awareness","Calm Presence"],
  ["Growth","Awareness","Resilience","Self-Trust"]
];

const scores={}; strengths.forEach(s=>scores[s]=0);
const form=document.getElementById("quiz");

questions.forEach((q,i)=>{
  const d=document.createElement("div");
  d.className="q";
  d.innerHTML=`<h3>${i+1}) ${q}</h3>`;
  options[i].forEach(o=>{
    d.innerHTML+=`<label><input type="radio" name="q${i}" value="${o}"> ${o}</label>`;
  });
  form.appendChild(d);
});

let pieChart,radarChart;

function showResults(){
  strengths.forEach(s=>scores[s]=0);
  for(let i=0;i<questions.length;i++){
    const sel=document.querySelector(`input[name="q${i}"]:checked`);
    if(!sel){alert("Please answer all questions.");return;}
    scores[sel.value]++;
  }

  document.getElementById("result").style.display="block";

  if(pieChart) pieChart.destroy();
  if(radarChart) radarChart.destroy();

  pieChart=new Chart(pieChart=document.getElementById("pieChart"),{
    type:"pie",
    data:{labels:strengths,datasets:[{data:strengths.map(s=>scores[s])}]}
  });

  radarChart=new Chart(radarChart=document.getElementById("radarChart"),{
    type:"radar",
    data:{labels:strengths,datasets:[{data:strengths.map(s=>scores[s]),fill:true}]},
    options:{scales:{r:{beginAtZero:true,max:5}}}
  });
}

function resetTool(){
  document.querySelectorAll("input[type=radio]").forEach(i=>i.checked=false);
  document.getElementById("result").style.display="none";
}

/* ✅ PDF FIX — ONLY SECTION CHANGED */
function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p","pt","a4");
  const w=doc.internal.pageSize.width;

  doc.setFontSize(16);
  doc.text("Your Positive Strengths Map",40,50);

  doc.addImage(pieChart.toBase64Image(),"PNG",40,80,220,160);
  doc.addImage(radarChart.toBase64Image(),"PNG",300,90,240,170);

  let y=280;
  doc.setFontSize(11);

  questions.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="q${i}"]:checked`);
    if(sel){
      const text=`${i+1}. ${q}\nChosen strength: ${sel.value}\nWhy this matters: ${strengthInsights[sel.value]}`;
      doc.text(doc.splitTextToSize(text,w-80),40,y);
      y+=42;
    }
  });

  doc.setFontSize(10);
  doc.text("Recommended Books:",40,y+20);
  doc.textWithLink(
    "https://emotionalintelligencedeveloper.com/recommended-books/",
    40,y+34,
    {url:"https://emotionalintelligencedeveloper.com/recommended-books/"}
  );

  doc.text("Help & Support:",40,y+56);
  doc.textWithLink(
    "https://emotionalintelligencedeveloper.com/help-page/",
    40,y+70,
    {url:"https://emotionalintelligencedeveloper.com/help-page/"}
  );

  doc.text(
    "Website: https://emotionalintelligencedeveloper.com/",
    w/2,
    820,
    {align:"center"}
  );

  doc.save("positive-strengths-map.pdf");
}
</script>

</body>
</html>
